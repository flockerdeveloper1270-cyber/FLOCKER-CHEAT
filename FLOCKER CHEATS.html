<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> 𝗙𝗟𝗢𝗖𝗞𝗘𝗥 𝗖𝗛𝗘𝗔𝗧𝗦 𝗜𝗢𝗦 </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 30px;
    }

    .painel {
      width: 100%;
      max-width: 400px;
      background-color: #111;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 10px #ffffff22;
    }

    .funcao {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 15px;
    }

    .funcao span {
      font-size: 16px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0;
      right: 0; bottom: 0;
      background-color: #555;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00ffcc;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    #injetar {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      background-color: #fff;
      color: #000;
      cursor: pointer;
      transition: background 0.3s;
    }

    #injetar:hover {
      background-color: #e5e5e5;
    }

    #terminal {
      margin-top: 20px;
      display: none;
      background: #000;
      color: #0f0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      height: 200px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .iphone-selector {
      margin-top: 20px;
    }

    .toggle-iphone {
      background: #fff;
      color: #000;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      text-align: center;
      border: none;
    }

    .iphone-list {
      display: none;
      margin-top: 10px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
    }

    .iphone-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .iphone-list li {
      padding: 12px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }

    .iphone-list li:hover {
      background-color: #333;
    }

    .selected-model {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1> 𝗙𝗟𝗢𝗖𝗞𝗘𝗥 𝗖𝗛𝗘𝗔𝗧𝗦 𝗜𝗢𝗦 </h1>

  <div class="painel">

    <div class="funcao">
      <span>🚀 AIMLOCK V1 ⚡️</span>
      <label class="switch">
        <input type="checkbox" id="🚀 AIMLOCK V1 ⚡️">
        <span class="slider"></span>
      </label>
    </div>

    <div class="funcao">
      <span>🚀 AIMLOCK V2 ⚡️</span>
      <label class="switch">
        <input type="checkbox" id="🚀 AIMLOCK V2 ⚡️">
        <span class="slider"></span>
      </label>
    </div>

    <div class="funcao">
      <span>🚀 NHẸ TÂM IOS ⚡️</span>
      <label class="switch">
        <input type="checkbox" id="🚀 NHẸ TÂM IOS ⚡️">
        <span class="slider"></span>
      </label>
    </div>

    <div class="funcao">
      <span>🚀 INJECTOR DATA CODE 📲</span>
      <label class="switch">
        <input type="checkbox" id="🚀 INJECTOR DATA CODE 📲">
        <span class="slider"></span>
      </label>
    </div>

    <button id="injetar"> 🚀 INJECTOR 🚀 </button>
    <div id="terminal"></div>

  </div>

  <script>
  document.getElementById('injetar').addEventListener('click', function() {
    window.location.href = "com.dts.freefireth://";
  });
</script>

</body>
</html>
